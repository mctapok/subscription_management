services:
  client-db:
    image: postgres:14
    environment:
      POSTGRES_DB: client_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - client-db_data:/var/lib/postgresql/data

  subscription-db:
    image: postgres:14
    environment:
      POSTGRES_DB: subscription_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - subscription-db_data:/var/lib/postgresql/data


  zookeeper:
    image: zookeeper:latest
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "client-created:1:1,account-created:1:1,history:1:1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - zookeeper

  client-service:
    build:
      context: .
      dockerfile: ./client-service/Dockerfile
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://client-db:5432/client_service
    depends_on:
      - client-db
      - kafka

  subscription-service:
    build:
      context: .
      dockerfile: ./subscription-service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://subscription-db:5432/subscription_service
    depends_on:
      - subscription-db
      - kafka

volumes:
  client-db_data:
  subscription-db_data: